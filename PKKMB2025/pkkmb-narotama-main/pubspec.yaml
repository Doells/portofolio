name: pkkmb
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.4.4 <4.0.0'

dependencies: 
  get: 4.6.6
  google_fonts: 6.2.1
  intl: 0.20.2
  get_storage: 2.1.1
  dio: 5.5.0+1
  animated_splash_screen: 1.3.0
  page_transition: 2.1.0
  flutter_remix: 0.0.3
  flutter_dotenv: 5.1.0
  flutter_svg: 2.0.10+1
  introduction_screen: 3.1.14
  percent_indicator: 4.2.3
  pretty_qr_code: 3.3.0
  adaptive_dialog: 2.1.0
  flutter_easyloading: 3.0.5
  linkfy_text: 1.1.6
  url_launcher: 6.3.0
  encrypt: 5.0.3
  qr_code_scanner: 1.0.1
  qr_scanner_overlay: 0.0.2
  easy_debounce: 2.0.3
  file_selector: 1.0.3
  cached_network_image: 3.4.1
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter

dev_dependencies: 
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  flutter_test: 
    sdk: flutter

flutter: 
  assets: 
    - assets/images/
